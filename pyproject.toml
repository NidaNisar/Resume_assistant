[project]
name = "resume-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nida Nisar", email = "nidanisar118@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "numpy>=2.5.4",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
]

[project.scripts]
resume-assistant = "resume_assistant:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
